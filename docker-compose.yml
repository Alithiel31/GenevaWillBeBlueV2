services:
  db:
    image: postgres:15
    container_name: gva_blue_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_blue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Merci de définir POSTGRES_PASSWORD dans votre fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:-genevawillbeblue}
    # Pas de port publié sur l'hôte : seul le service "web" a besoin d'atteindre la base,
    # via le réseau interne "gva_network".
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gva_network

  web:
    build: .
    container_name: gva_blue_web
    restart: unless-stopped
    ports:
      # Le Dockerfile construit une image de production (adapter-node) qui écoute sur $PORT (3000).
      - "8888:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-agent_blue}:${POSTGRES_PASSWORD:?Merci de définir POSTGRES_PASSWORD dans votre fichier .env}@db:5432/${POSTGRES_DB:-genevawillbeblue}
    depends_on:
      - db
    # Pas de bind-mount du code source : l'image contient déjà le build de production,
    # monter ". :/app" par-dessus écraserait le dossier "build" généré par le Dockerfile.
    networks:
      - gva_network

volumes:
  db_data:

networks:
  gva_network:
    driver: bridge